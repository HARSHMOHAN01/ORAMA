<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Pothole Admin Panel{% endblock %}</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Admin stylesheet -->
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-road-barrier logo-icon"></i>
                <span class="logo-text">Pothole Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('admin.admin_dashboard') }}" class="nav-item {% if request.endpoint == 'admin.admin_dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-table-columns"></i> Dashboard
                </a>
                <a href="{{ url_for('admin.admin_analytics') }}" class="nav-item {% if request.endpoint == 'admin.admin_analytics' %}active{% endif %}">
                    <i class="fa-solid fa-chart-line"></i> Analytics
                </a>
                <a href="http://localhost:5173" target="_blank" class="nav-item external">
                    <i class="fa-solid fa-desktop"></i> React Dashboard <i class="fa-solid fa-up-right-from-square small-icon"></i>
                </a>
            </nav>
            <div class="sidebar-footer">
                <span class="status-indicator online"></span> System Online
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                <div class="header-user">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Administrator</span>
                </div>
            </header>
            
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{{ url_for('admin.static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
